# =============================================================================
# benchmark.yml – Run the AI CPU benchmark on Azure VMs over SSH.
#
# Replaces the previous `az vm run-command` approach: the control node
# (a GitHub Actions runner) connects to each VM through the load balancer's
# inbound SSH NAT rules and executes scripts/benchmark.sh directly.
#
# Inventory: generated by scripts/build-ansible-inventory.sh, e.g.
#   [benchmark]
#   bm-d4ps-v6 ansible_host=<lb-ip> ansible_port=50002 ansible_user=azureuser
#
# Configuration comes from environment variables on the control node
# (mirroring the env vars consumed by scripts/benchmark.sh):
#   Required : HF_TOKEN, HF_USERNAME, MODEL_ID, MODEL_FILENAME
#   Optional : STORAGE_ACCOUNT, MSI_CLIENT_ID, CACHE_CONTAINER,
#              MODEL_DIR, THREAD_COUNTS, BENCHMARK_TOKENS,
#              BENCHMARK_PROMPT, BATCHED_PARALLEL, RESULTS_DIR,
#              BENCHMARK_TIMEOUT, BENCHMARK_SERIAL, RESULT_LOG
#
# Usage:
#   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook \
#     -i <inventory> ansible/benchmark.yml
# =============================================================================
---
- name: Run AI CPU benchmark with llama.cpp
  hosts: benchmark
  become: true
  gather_facts: false
  # BENCHMARK_SERIAL controls how many VMs are benchmarked at once.
  # "1" (default) benchmarks one VM at a time — avoids Hugging Face
  # rate-limiting when model caching is disabled. Set to a higher number
  # or "100%" to benchmark VMs in parallel.
  serial: "{{ lookup('env', 'BENCHMARK_SERIAL') | default('1', true) }}"
  vars:
    # Local directory (on the control node) where per-VM results are written.
    results_dir: "{{ lookup('env', 'RESULTS_DIR') | default('./benchmark-results', true) }}"
    # Durable log on each VM; collected even when the async task times out.
    benchmark_log_path: "{{ lookup('env', 'RESULT_LOG') | default('/var/tmp/ai-cpu-benchmark.log', true) }}"
    # Seconds to wait for cloud-init to finish installing llama.cpp.
    cloud_init_timeout: 1800
    # Seconds to wait for the benchmark itself (mirrors the old Run Command
    # polling timeout).
    benchmark_timeout: "{{ lookup('env', 'BENCHMARK_TIMEOUT') | default(14400, true) | int }}"

  tasks:
    - name: Wait for SSH connectivity
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Wait for cloud-init readiness marker (/tmp/cloud-init-done)
      ansible.builtin.wait_for:
        path: /tmp/cloud-init-done
        timeout: "{{ cloud_init_timeout }}"

    # Runs asynchronously with periodic polling so the long-running benchmark
    # survives the load balancer's 4-minute idle TCP timeout: each poll opens
    # a fresh SSH session instead of holding one connection open for hours.
    - name: Copy llama.cpp benchmark script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/benchmark.sh"
        dest: /tmp/ai-cpu-benchmark.sh
        mode: "0755"

    - name: Run llama.cpp benchmark (scripts/benchmark.sh)
      ansible.builtin.command: /tmp/ai-cpu-benchmark.sh
      environment:
        HF_TOKEN: "{{ lookup('env', 'HF_TOKEN') }}"
        HF_USERNAME: "{{ lookup('env', 'HF_USERNAME') }}"
        MODEL_ID: "{{ lookup('env', 'MODEL_ID') }}"
        MODEL_FILENAME: "{{ lookup('env', 'MODEL_FILENAME') }}"
        STORAGE_ACCOUNT: "{{ lookup('env', 'STORAGE_ACCOUNT') }}"
        MSI_CLIENT_ID: "{{ lookup('env', 'MSI_CLIENT_ID') }}"
        MODEL_DIR: "{{ lookup('env', 'MODEL_DIR') | default('/opt/models', true) }}"
        RESULT_LOG: "{{ benchmark_log_path }}"
        CACHE_CONTAINER: "{{ lookup('env', 'CACHE_CONTAINER') | default('model-cache', true) }}"
        THREAD_COUNTS: "{{ lookup('env', 'THREAD_COUNTS') }}"
        BENCHMARK_TOKENS: "{{ lookup('env', 'BENCHMARK_TOKENS') | default('128', true) }}"
        BENCHMARK_PROMPT: "{{ lookup('env', 'BENCHMARK_PROMPT') | default('512', true) }}"
        BATCHED_PARALLEL: "{{ lookup('env', 'BATCHED_PARALLEL') | default('1 2 4', true) }}"
      async: "{{ benchmark_timeout }}"
      poll: 60
      register: benchmark_run
      ignore_errors: true

    - name: Ensure local results directory exists
      ansible.builtin.file:
        path: "{{ results_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    # Collect the durable VM log after success, failure, or timeout. This
    # preserves completed benchmark rows when async polling returns no stdout.
    - name: Collect benchmark log from VM
      ansible.builtin.slurp:
        src: "{{ benchmark_log_path }}"
      register: benchmark_log
      become: true
      changed_when: false
      failed_when: false

    - name: Classify benchmark result
      ansible.builtin.set_fact:
        benchmark_state: >-
          {{ 'Succeeded' if benchmark_run is succeeded else
             ('TimedOut' if 'Timeout exceeded' in (benchmark_run.msg | default(''))
              else 'Failed') }}
        benchmark_failed: "{{ benchmark_run is not succeeded }}"

    # Prefer async stdout on success: the durable tee log can lag and drop the
    # JSON trailer. On timeout/failure, slurp the log (stdout is often empty).
    - name: Prepare benchmark output
      ansible.builtin.set_fact:
        benchmark_output: >-
          {% if benchmark_run is succeeded and (benchmark_run.stdout | default('') | trim | length > 0) %}
          {{ benchmark_run.stdout }}
          {% if benchmark_run.stderr | default('') | trim | length > 0 %}
          --- STDERR ---
          {{ benchmark_run.stderr }}
          {% endif %}
          {% elif benchmark_log.content is defined %}
          {{ benchmark_log.content | b64decode }}
          {% else %}
          {{ benchmark_run.stdout | default('') }}
          {% if benchmark_run.stderr | default('') | trim | length > 0 %}
          --- STDERR ---
          {{ benchmark_run.stderr }}
          {% endif %}
          {% endif %}

    # Result file format matches the old Run Command output so the existing
    # aggregation step (awk on BENCHMARK_JSON_START/END) keeps working. The
    # output may contain partial CSV rows when a long run times out.
    - name: Save benchmark output to local results file
      ansible.builtin.copy:
        content: |
          === VM: {{ inventory_hostname }} | State: {{ benchmark_state }} ===
          --- STDOUT ---
          {{ benchmark_output }}
          {% if benchmark_state == 'TimedOut' %}
          --- STATUS ---
          Benchmark exceeded {{ benchmark_timeout }} seconds; partial output was collected from {{ benchmark_log_path }}.
          {% endif %}
          === END {{ inventory_hostname }} ===
        dest: "{{ results_dir }}/{{ inventory_hostname }}.txt"
        mode: "0644"
      delegate_to: localhost
      become: false

    - name: Print benchmark output
      ansible.builtin.debug:
        msg: "{{ benchmark_output.split('\n') }}"

- name: Verify that all benchmarks succeeded
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: Fail if any benchmark did not succeed
      ansible.builtin.fail:
        msg: >-
          Benchmark {{
            'timed out' if hostvars[item].benchmark_state | default('Failed') == 'TimedOut'
            else hostvars[item].benchmark_state | default('Failed') | lower
          }}
          on {{ item }}:
          {{ hostvars[item].benchmark_run.msg
             | default(hostvars[item].benchmark_run.stderr
             | default('unknown error')) }}
          {% if hostvars[item].benchmark_state | default('Failed') == 'TimedOut' %}
          Partial results were saved to the results artifact.
          {% endif %}
      # benchmark_failed is undefined when a host never completed the play
      # (e.g. it was unreachable), which also counts as a failure.
      when: hostvars[item].benchmark_failed | default(true)
      loop: "{{ groups['benchmark'] }}"
