# =============================================================================
# benchmark.yml – Run the AI CPU benchmark on Azure VMs over SSH.
#
# Replaces the previous `az vm run-command` approach: the control node
# (a GitHub Actions runner) connects to each VM through the load balancer's
# inbound SSH NAT rules and executes scripts/benchmark.sh directly.
#
# Inventory: generated by scripts/build-ansible-inventory.sh, e.g.
#   [benchmark]
#   bm-d4ps-v6 ansible_host=<lb-ip> ansible_port=50002 ansible_user=azureuser
#
# Configuration comes from environment variables on the control node
# (mirroring the env vars consumed by scripts/benchmark.sh):
#   Required : HF_TOKEN, HF_USERNAME, MODEL_ID, MODEL_FILENAME
#   Optional : STORAGE_ACCOUNT, MSI_CLIENT_ID, CACHE_CONTAINER,
#              THREAD_COUNTS, BENCHMARK_TOKENS, BENCHMARK_PROMPT,
#              BATCHED_PARALLEL, RESULTS_DIR, BENCHMARK_TIMEOUT
#
# Usage:
#   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook \
#     -i <inventory> ansible/benchmark.yml
# =============================================================================
---
- name: Run AI CPU benchmark with llama.cpp
  hosts: benchmark
  become: true
  gather_facts: false
  vars:
    # Local directory (on the control node) where per-VM results are written.
    results_dir: "{{ lookup('env', 'RESULTS_DIR') | default('./benchmark-results', true) }}"
    # Seconds to wait for cloud-init to finish installing llama.cpp.
    cloud_init_timeout: 1800
    # Seconds to wait for the benchmark itself (mirrors the old Run Command
    # polling timeout).
    benchmark_timeout: "{{ lookup('env', 'BENCHMARK_TIMEOUT') | default(14400, true) | int }}"

  tasks:
    - name: Wait for SSH connectivity
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Wait for cloud-init readiness marker (/tmp/cloud-init-done)
      ansible.builtin.wait_for:
        path: /tmp/cloud-init-done
        timeout: "{{ cloud_init_timeout }}"

    # Runs asynchronously with periodic polling so the long-running benchmark
    # survives the load balancer's 4-minute idle TCP timeout: each poll opens
    # a fresh SSH session instead of holding one connection open for hours.
    - name: Run llama.cpp benchmark (scripts/benchmark.sh)
      ansible.builtin.script: "{{ playbook_dir }}/../scripts/benchmark.sh"
      environment:
        HF_TOKEN: "{{ lookup('env', 'HF_TOKEN') }}"
        HF_USERNAME: "{{ lookup('env', 'HF_USERNAME') }}"
        MODEL_ID: "{{ lookup('env', 'MODEL_ID') }}"
        MODEL_FILENAME: "{{ lookup('env', 'MODEL_FILENAME') }}"
        STORAGE_ACCOUNT: "{{ lookup('env', 'STORAGE_ACCOUNT') }}"
        MSI_CLIENT_ID: "{{ lookup('env', 'MSI_CLIENT_ID') }}"
        CACHE_CONTAINER: "{{ lookup('env', 'CACHE_CONTAINER') | default('model-cache', true) }}"
        THREAD_COUNTS: "{{ lookup('env', 'THREAD_COUNTS') }}"
        BENCHMARK_TOKENS: "{{ lookup('env', 'BENCHMARK_TOKENS') | default('128', true) }}"
        BENCHMARK_PROMPT: "{{ lookup('env', 'BENCHMARK_PROMPT') | default('512', true) }}"
        BATCHED_PARALLEL: "{{ lookup('env', 'BATCHED_PARALLEL') | default('1 2 4', true) }}"
      async: "{{ benchmark_timeout }}"
      poll: 60
      register: benchmark_run
      ignore_errors: true

    - name: Ensure local results directory exists
      ansible.builtin.file:
        path: "{{ results_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    # Result file format matches the old Run Command output so the existing
    # aggregation step (awk on BENCHMARK_JSON_START/END) keeps working.
    - name: Save benchmark output to local results file
      ansible.builtin.copy:
        content: |
          === VM: {{ inventory_hostname }} | State: {{ 'Succeeded' if benchmark_run is succeeded else 'Failed' }} ===
          --- STDOUT ---
          {{ benchmark_run.stdout | default('') }}
          {% if benchmark_run.stderr | default('') | trim | length > 0 %}
          --- STDERR ---
          {{ benchmark_run.stderr }}
          {% endif %}
          === END {{ inventory_hostname }} ===
        dest: "{{ results_dir }}/{{ inventory_hostname }}.txt"
        mode: "0644"
      delegate_to: localhost
      become: false

    - name: Print benchmark output
      ansible.builtin.debug:
        msg: "{{ (benchmark_run.stdout | default('')).split('\n') }}"

    - name: Fail if the benchmark did not succeed
      ansible.builtin.fail:
        msg: >-
          Benchmark failed on {{ inventory_hostname }}:
          {{ benchmark_run.msg | default(benchmark_run.stderr | default('unknown error')) }}
      when: benchmark_run is failed
