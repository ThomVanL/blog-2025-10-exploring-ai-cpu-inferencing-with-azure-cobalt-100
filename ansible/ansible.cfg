# =============================================================================
# Ansible configuration for AI CPU benchmarking.
#
# The control node is ephemeral (a GitHub Actions runner), so host key
# checking is disabled. SSH keepalives are required because the VMs sit
# behind an Azure Load Balancer whose inbound NAT rules have a 4-minute
# idle timeout with TCP reset enabled.
# =============================================================================
[defaults]
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 60

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=10
pipelining = True
retries = 5
